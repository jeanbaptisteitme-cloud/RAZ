<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="apexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background (Rounded Squircle for mobile icon) -->
  <rect width="512" height="512" rx="112" fill="url(#apexBg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(163, 230, 53, 0.25)" stroke-width="4" />
  
  <!-- Stylized Barbell / Overload Apex Chevron -->
  <g transform="translate(256, 256)">
    <!-- Central Barbell Shaft -->
    <rect x="-180" y="-12" width="360" height="24" rx="8" fill="#94a3b8" />
    
    <!-- Outer Plates -->
    <rect x="-160" y="-75" width="22" height="150" rx="6" fill="url(#plateGrad)" stroke="#475569" stroke-width="3" />
    <rect x="-130" y="-95" width="26" height="190" rx="7" fill="url(#plateGrad)" stroke="#475569" stroke-width="3" />
    <rect x="104" y="-95" width="26" height="190" rx="7" fill="url(#plateGrad)" stroke="#475569" stroke-width="3" />
    <rect x="138" y="-75" width="22" height="150" rx="6" fill="url(#plateGrad)" stroke="#475569" stroke-width="3" />
    
    <!-- Central Progressive Overload Chevron / Apex Lighting -->
    <path d="M -70 45 L 0 -75 L 70 45 L 35 45 L 0 -15 L -35 45 Z" fill="url(#voltGrad)" filter="url(#neonGlow)" />
    
    <!-- Dynamic Upward Overload Arrow -->
    <path d="M 0 -115 L -30 -65 L -10 -65 L -10 -35 L 10 -35 L 10 -65 L 30 -65 Z" fill="#ffffff" />
  </g>
</svg>
